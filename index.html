<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Form</title>
    <style>
    /* Inlined styles — improved visual design replacing Bootstrap */
    :root{
      --bg-1: #eef2ff;
      --bg-2: #f8fafc;
      --card:#ffffff;
      --muted:#6c757d;
      --primary:linear-gradient(90deg,#2563eb,#7c3aed);
      --accent:#6d28d9;
      --shadow: 0 8px 30px rgba(16,24,40,0.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;line-height:1.5;color:#0f172a;background:radial-gradient(1200px 600px at 10% 10%,rgba(124,58,237,0.06),transparent 10%), linear-gradient(180deg,var(--bg-2),var(--bg-1));
      -webkit-font-smoothing:antialiased;
    }
    .container{max-width:720px;margin-left:auto;margin-right:auto;padding:28px}
    .container-centered{display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:var(--card);border-radius:12px;border:1px solid rgba(15,23,42,0.04);box-shadow:var(--shadow);overflow:hidden}
    .card-body{padding:28px}
    .h3{font-size:1.375rem;margin:0 0 8px 0;color:#0b1220}
    .subtle{color:var(--muted);font-size:0.95rem;margin-bottom:1rem;text-align:center}
    .mb-3{margin-bottom:16px}
    .form-label{display:block;margin-bottom:8px;font-weight:600;font-size:0.95rem;color:#0b1220}
    .form-control,.form-select{display:block;width:100%;padding:12px 14px;border:1px solid rgba(15,23,42,0.08);border-radius:10px;background:#fff;color:#0b1220;font-size:1rem;transition:box-shadow .15s,transform .08s}
    .form-control:focus,.form-select:focus{outline:none;box-shadow:0 6px 20px rgba(99,102,241,0.12);border-color:rgba(109,40,217,0.6)}
    textarea.form-control{min-height:140px;resize:vertical}
    .d-grid{display:block}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;color:#fff;background-image:var(--primary);box-shadow:0 6px 18px rgba(37,99,235,0.12);transition:transform .08s ease,box-shadow .12s}
    .btn:active{transform:translateY(1px)}
    .btn:focus{outline:none;box-shadow:0 8px 30px rgba(99,102,241,0.14)}
    .btn-primary{background-image:var(--primary)}
    .text-center{text-align:center}
    .mx-auto{margin-left:auto;margin-right:auto}
    .col-lg-6{width:100%}
    @media(min-width:992px){.col-lg-6{max-width:540px}}
    /* small helpers */
    .shadow-sm{box-shadow:0 6px 18px rgba(2,6,23,0.06)}
    .card:hover{transform:translateY(-4px);transition:transform .18s ease}
    </style>
</head>
<body>
  <div class="container container-centered">
    <div class="row justify-content-center">
      <div class="col-lg-6 mx-auto">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-3 text-center">Contact Us</h1>
            <form action="#" method="post">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <select class="form-select" id="subject" name="subject">
                  <option value="general">General Question</option>
                  <option value="support">Support Request</option>
                  <option value="feedback">Feedback</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="Type your message" required></textarea>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
