<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9NDik7RDBAE5xk0ly3bcpj3z5K4OD+xO2F+GQzVp+3KpA4YCM+2Kq5mBS7FqR1E5" crossorigin="anonymous">
  <style>

  </style>
</head>
<body class="bg-light">
  <div class="container container-centered">
    <div class="row justify-content-center">
      <div class="col-lg-6 mx-auto">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-3 text-center">Contact Us</h1>
            <form action="#" method="post">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <select class="form-select" id="subject" name="subject">
                  <option value="general">General Question</option>
                  <option value="support">Support Request</option>
                  <option value="feedback">Feedback</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="Type your message" required></textarea>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-R7gZ0zr4zyq0mYbFmswWqG3RP4pHplt3WY1Q5PS8ftAqI8voQ32fGET0UFjVHSyD" crossorigin="anonymous"></script>
</body>
</html>
